  { name: "Base", rpc: "https://base-rpc.publicnode.com", usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" },
  { name: "Arbitrum", rpc: "https://arbitrum-one-rpc.publicnode.com", usdc: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831" },
  { name: "Polygon", rpc: "https://polygon-bor-rpc.publicnode.com", usdc: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359" }
];

const SPENDERS = [
  { name: "Permit2", addr: "0x000000000022D473030F116dDEE9F6B43aC78BA3" },
  { name: "0xProxy", addr: "0xDef1C0ded9bec7F1a1670819833240f027b25EfF" }
];

const pad32 = (a) => a.toLowerCase().replace(/^0x/, "").padStart(64, "0");

async function rpc(url, method, params) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
  });
  return (await r.json()).result;
}

async function auditCycle() {
  console.log("[AegisScope Watchdog] Running mainnet allowance & proxy slot check at", new Date().toISOString());
  for (const wallet of MONITORED_WALLETS) {
    for (const c of CHAINS) {
      for (const s of SPENDERS) {
        const data = "0xdd62ed3e" + pad32(wallet) + pad32(s.addr);
        const hex = await rpc(c.rpc, "eth_call", [{ to: c.usdc, data }, "latest"]);
        const allow = hex && hex !== "0x" ? BigInt(hex) : 0n;
        const impl = await rpc(c.rpc, "eth_getStorageAt", [s.addr, EIP1967_IMPL_SLOT, "latest"]);
        if (allow > 0n) {
          const msg = \`[ALERT] \${c.name}: \${wallet} has active USDC allowance to \${s.name} (\${s.addr}) | impl=\${impl}\`;
          console.warn(msg);
          if (WEBHOOK_URL) {
            await fetch(WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: msg })
            });
          }
        }
      }
    }
  }
}

auditCycle();
